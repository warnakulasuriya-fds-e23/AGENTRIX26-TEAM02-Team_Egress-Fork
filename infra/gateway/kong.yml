_format_version: "3.0"

services:
  - name: ai-service
    url: http://ai-service:8000
    # LLM/RAG orchestration (LangGraph, reranking, tool calls) regularly runs past
    # Kong's 60s default — a real chat turn timed out here during testing.
    connect_timeout: 10000
    write_timeout: 180000
    read_timeout: 180000
    routes:
      - name: ai-route
        paths:
          - /api/ai
        strip_path: false

  - name: user-service
    url: http://user-service:8002
    routes:
      - name: user-route
        paths:
          - /api/users
        strip_path: false

  - name: trip-service
    url: http://trip-service:8002
    routes:
      - name: trip-route
        paths:
          - /api/v1/trips
        strip_path: false

  - name: booking-service
    url: http://booking-service:8004
    routes:
      - name: booking-route
        paths:
          - /api/v1/hotel-bookings
          - /api/v1/hotels
          - /api/v1/dining-reservations
          - /api/v1/transport-bookings
        strip_path: false

  - name: destination-service
    url: http://destination-service:8003
    routes:
      - name: destination-route
        paths:
          - /api/v1/regions
          - /api/v1/locations
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600
